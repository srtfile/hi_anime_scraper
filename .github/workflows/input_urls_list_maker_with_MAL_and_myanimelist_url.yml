name: Run Anime URL Generator

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (if any)
        run: |
          pip install requests

      - name: Run script
        run: |
          python input_urls_list_maker_with_MAL_and_myanimelist_url.py

      - name: Commit and push output
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions"

          git add input_urls_list_maker_with_MAL_and_myanimelist_url.txt input_urls_list_maker_with_MAL_and_myanimelist_url_skipped_items.txt || true

          git commit -m "Auto update generated output" || echo "No changes to commit"

          git push
