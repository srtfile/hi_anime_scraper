name: Run Anime URL Generator

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write   # 🔥 REQUIRED to allow push

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: false   # we will use token manually

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install requests

      - name: Run script
        run: |
          python input_urls_list_maker_with_MAL_and_myanimelist_url.py

      - name: Commit and push output
        run: |
          git config --local user.email "actions@github.com"
          git config --local user.name "github-actions[bot]"

          git add input_urls_list_maker_with_MAL_and_myanimelist_url.txt input_urls_list_maker_with_MAL_and_myanimelist_url_skipped_items.txt || true

          git commit -m "Auto update generated output" || echo "No changes to commit"

          git push https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git HEAD:${{ github.ref_name }}
